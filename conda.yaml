# Setup:
#   mamba env create -f conda.yaml
#   mamba activate spatialcells
#   pip install --no-deps .

# Use conda-scimap.yaml instead if you need tutorial 8 (scimap joint analysis)
# — scimap's hard pins force an older stack across the whole env.

name: spatialcells

channels:
  - conda-forge

dependencies:
  - python >=3.10,<3.13
  - pip
  - ipykernel
  - nbconvert
  - nbclient

  # Core runtime
  - shapely >=2.0       # hard: from_geojson/to_geojson are 2.x APIs
  - numpy
  - pandas
  - scipy
  - scikit-learn
  - matplotlib
  - seaborn
  - tqdm
  - leidenalg
  - scanpy
  - anndata

  # Optional: for joint analyses with other packages as featured in the tutorials
  - squidpy
  - plotly
