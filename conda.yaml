# Setup:
#   mamba env create -f conda.yaml
#   mamba activate spatialcells
#   pip install --no-deps .                 # the spatialcells package itself
#   pip install --no-deps scimap==2.3.6 smart_open   # only if you want tutorial 8

name: spatialcells

channels:
  - conda-forge

dependencies:
  - python >=3.10,<3.12
  - pip
  - ipykernel
  - nbconvert
  - nbclient

  # Core runtime
  - shapely >=2.0       # hard: from_geojson/to_geojson are 2.x APIs
  - numpy <2
  - pandas <2.2
  - scipy =1.12.*
  - scikit-learn >=1.6
  - matplotlib <3.9
  - seaborn
  - tqdm
  - leidenalg
  - scanpy <1.11
  - anndata <0.11

  # Optional: for joint analyses with other packages as featured in the tutorials
  - squidpy =1.4.*
  - plotly
  - numba =0.58.*
  - llvmlite =0.41.*
  - dask >=2023.11,<2024
  - dask-image <2024
  - zarr >=2.11,<3
  - setuptools <81
